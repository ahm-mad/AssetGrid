name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Placeholder values only — no real secrets. The build never contacts
  # Supabase/Stripe (every page is server-rendered on demand, not
  # pre-rendered at build time), it just needs these to be non-empty.
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_dummy
  SUPABASE_SECRET_KEY: sb_secret_dummy
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  STRIPE_SECRET_KEY: sk_test_dummy
  STRIPE_WEBHOOK_SECRET: whsec_dummy
  INTERNAL_FUNCTION_SECRET: dummy

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generate route types
        run: npx next typegen

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Build
        run: npm run build
